# SmartWaste India Calendar Configuration
# 
# This file defines Indian national holidays, Karnataka state holidays,
# and major festivals with their dates and intensity values.
# 
# IMPORTANT: Do NOT silently invent festival dates. Only use verified dates.
# 
# Format:
# - Recurring holidays: use "date" with "MM-DD" format (recurs every year)
# - Specific date holidays: use "dates" with list of "YYYY-MM-DD" (specific years only)
# - Festivals: use "dates" with list of "YYYY-MM-DD", plus "window_days" and "intensity"
#   - window_days: number of days before/after the festival date that have reduced intensity
#   - intensity: base intensity for the festival date (window days get 50% intensity)
# 
# To add future years: simply add more dates to the "dates" lists.
# For recurring holidays, they automatically apply to all years.

national_holidays:
  - name: "Republic Day"
    date: "01-26"
  - name: "Independence Day"
    date: "08-15"
  - name: "Gandhi Jayanti"
    date: "10-02"

